<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Idle Adventures </title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="StageInfo">
        <p> Stage: <span id="currentStage"> 1 </span></p>
    </div>

    <div id="monster"></div>

    <div id="monsterHPInfo">
        <progress id="monsterHP" value="50" max="50"></progress>
        <!-- <p> Monster HP: <span id="monsterHP"> 50 </span></p> -->
    </div>

    <br>
    <p> Click Power: <span id = "currentClickPower"> 1 </span></p>
    <p> Auto Clickers: <span id ="currentAutoClickers"> 0 </span></p>
    <p> Coins: <span id = "currentCoins"> 0 </span></p>

    <br>
    <button id="upgrade"> Click Power Upgrade </button>
    <p> Cost: <span id="upgradeCost"> 20 </span> coins</p>

    <br>
    <button id="autoClickerBtn"> Auto Clicker </button>
    <p> Cost: <span id="autoClickerCost"> 100 </span> coins </p>

    <br>
    <button id="upgrade2"> Click Power Upgrade 2 </button>
    <p> Cost: <span id="upgradeCost2"> 300 </span> coins</p>
</body>
</html>
